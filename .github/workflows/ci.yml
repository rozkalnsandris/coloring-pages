name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: coloring-pages-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install importer dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Validate Python syntax
        run: python3 -m compileall -q tools tests

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build importer runtime image
        run: docker build --pull=false -t coloring-pages-ci .

      - name: Smoke importer runtime
        run: docker run --rm --network none --read-only --tmpfs /tmp --entrypoint /usr/local/bin/coloring-pages-import coloring-pages-ci --help >/dev/null

      - name: Validate SIMPLE-DEPLOY JSON
        run: python3 -m json.tool .simple-deploy.json >/dev/null

      - name: Validate Compose source
        run: docker compose -f deploy/docker-compose.simple.yml config >/dev/null
