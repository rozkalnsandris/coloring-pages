name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: coloring-pages-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Python syntax
        run: python3 -m compileall -q tools tests

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate current catalogue inputs
        run: python3 tools/build_catalog.py --check

      - name: Exercise catalogue generation
        run: python3 tools/build_catalog.py --output /tmp/catalog.json

      - name: Validate SIMPLE-DEPLOY JSON
        run: python3 -m json.tool .simple-deploy.json >/dev/null

      - name: Validate Compose source
        run: docker compose -f deploy/docker-compose.simple.yml config >/dev/null
