name: SIMPLE-DEPLOY Coloring Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/simple-deploy.yml"
      - ".simple-deploy.json"
      - "Dockerfile"
      - "tools/coloring-pages-import"
      - "index.html"
      - "detail.html"
      - "print.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "deploy/**"

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: rozkalnsandris/ops-workflows/.github/workflows/simple-deploy.yml@94187cc447fc80757db10ac25d49717d00dc8430
    with:
      source_sha: ${{ github.sha }}
