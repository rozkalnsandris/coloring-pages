name: Responsive Browser QA

# Browser-layout evidence for UI/UX audit finding 15 (#511).
# This does not assert physical-device, screen-reader or LIVE QA.
on:
  pull_request:
    paths:
      - .github/workflows/responsive-browser-qa.yml
      - tests/manual/qa_responsive_layout_511.py
      - index.html
      - css/**
      - js/category-mobile-rows.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Playwright
        run: python3 -m pip install --disable-pip-version-check 'playwright==1.64.0'

      - name: Install Playwright Chromium and OS dependencies
        run: python3 -m playwright install --with-deps chromium

      - name: Check exact responsive viewport boundaries
        run: python3 tests/manual/qa_responsive_layout_511.py
