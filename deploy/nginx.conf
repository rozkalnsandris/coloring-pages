worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/legacy-id-aliases.conf;

    map $arg_campaign $legacy_campaign_suffix {
        default "";
        "dortmund-01" "&campaign=dortmund-01";
    }

    map $arg_embedded $legacy_embedded_suffix {
        default "";
        "1" "&embedded=1";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location = /health {
            access_log off;
            default_type text/plain;
            add_header X-Robots-Tag "noindex" always;
            return 200 "ok\n";
        }

        location = /ready {
            access_log off;
            default_type text/plain;
            add_header X-Robots-Tag "noindex" always;
            return 200 "ready\n";
        }

        # A trusted RPi5 content operator may publish a validated sitemap.xml
        # beside catalog.json. Until then, keep the existing static sitemap.
        location = /sitemap.xml {
            root /var/lib/coloring-pages/public;
            add_header Cache-Control "no-cache" always;
            try_files /sitemap.xml @static_sitemap;
        }

        location @static_sitemap {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache" always;
            try_files /sitemap.xml =404;
        }

        # Exact shared read-only runtime registry; no image fallback.
        location = /categories.json {
            root /var/lib/coloring-pages/public;
            add_header Cache-Control "no-store" always;
            try_files /categories.json =503;
        }

        # Only managed Topics v2; never fall back to image seed.
        location = /topics.json {
            root /var/lib/coloring-pages/public;
            add_header Cache-Control "no-store" always;
            try_files /topics.json =503;
        }

        # Sanitized Category↔Topic projection from the protected RPi5 registry.
        location = /category-topics.json {
            root /var/lib/coloring-pages/public;
            add_header Cache-Control "no-store" always;
            try_files /category-topics.json =503;
        }

        location = /catalog.json {
            root /var/lib/coloring-pages/public;
            add_header Cache-Control "no-cache" always;
            try_files /catalog.json =404;
        }

        location = /legacy-id-aliases.json {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store" always;
            if (!-f $legacy_id_activation_marker) {
                return 404;
            }
            try_files /legacy-id-aliases.json =404;
        }

        # Content-addressed, SIL OFL webfonts stay cached across page visits.
        location /assets/fonts/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location /media/ {
            root /var/lib/coloring-pages/public;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri @legacy_media_missing;
        }

        location @legacy_media_missing {
            set $legacy_media_target "";
            if (-f $legacy_id_activation_marker) {
                set $legacy_media_target $legacy_media_redirect_uri;
            }
            if ($legacy_media_target != "") {
                return 308 $legacy_media_target;
            }
            return 404;
        }

        location = /kita {
            add_header Cache-Control "no-cache" always;
            try_files /kita.html =404;
        }

        location = /kita/ {
            absolute_redirect off;
            return 308 /kita$is_args$args;
        }

        location = /kita/herbst {
            add_header Cache-Control "no-cache" always;
            try_files /kita-herbst.html =404;
        }

        location = /kita/herbst/ {
            absolute_redirect off;
            return 308 /kita/herbst$is_args$args;
        }

        location ~ ^/(tiere|fahrzeuge|alphabet|lernen|figuren|jahreszeiten|essen-natur|herbst)$ {
            add_header Cache-Control "no-cache" always;
            try_files /$1.html =404;
        }

        location = / {
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        location = /detail.html {
            set $legacy_detail_target_id "";
            if (-f $legacy_id_activation_marker) {
                set $legacy_detail_target_id $legacy_activity_redirect_id;
            }
            if ($legacy_detail_target_id != "") {
                return 308 /detail.html?id=$legacy_detail_target_id$legacy_campaign_suffix;
            }
            add_header Cache-Control "no-cache" always;
            try_files /detail.html =404;
        }

        location = /print.html {
            set $legacy_print_target_id "";
            if (-f $legacy_id_activation_marker) {
                set $legacy_print_target_id $legacy_activity_redirect_id;
            }
            if ($legacy_print_target_id != "") {
                return 308 /print.html?id=$legacy_print_target_id$legacy_embedded_suffix;
            }
            add_header Cache-Control "no-cache" always;
            try_files /print.html =404;
        }

        location ~* \.html$ {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # ES modules use .mjs, which is not mapped by the stock Nginx mime.types.
        # Browsers require a JavaScript MIME type for module scripts/imports.
        location ~* \.mjs$ {
            default_type application/javascript;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location ~* \.(?:css|js)$ {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
